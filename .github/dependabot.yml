version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TanStack Table v9 rewrote the API (createCoreRowModel, two-argument
      # Table/Row generics, feature maps). Every list view renders through
      # ResourceTable, so that upgrade is a migration to schedule, not a bump
      # to review weekly.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `astro check` (@astrojs/check) declares a typescript ^5 || ^6 peer
      # range; a TypeScript 7 bump fails `npm ci` until that range widens.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # sharp is pinned exactly because its libvips binaries are LGPL and the
      # licence scan can only be cleared per version on this plan; every bump
      # would re-flag fourteen packages. It runs on a runner over our own
      # committed screenshots, never untrusted input, so a frozen version
      # carries no meaningful exposure. Bump it deliberately, then re-clear
      # the scan — see the landing-site section of CLAUDE.md.
      - dependency-name: "sharp"

  - package-ecosystem: docker
    directory: "/site"
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node lines never become LTS. Dependabot walks one major at
      # a time, so it offered 25 — already end of life — while 26 was out. The
      # node major moves on the October LTS cadence, in one commit across mise,
      # the workflows and the site container so they stay in parity.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/site"
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node lines never become LTS. Dependabot walks one major at
      # a time, so it offered 25 — already end of life — while 26 was out. The
      # node major moves on the October LTS cadence, in one commit across mise,
      # the workflows and the site container so they stay in parity.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
