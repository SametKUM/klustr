name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build and sign artifacts but never publish: the release job is
  # gated on a tag ref. Use this to check that a branch still builds and signs
  # on both platforms, not to cut a release.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (artifacts only, no release)"
        required: false

permissions:
  contents: read

# Serialize releases so two quick tags can't race the Homebrew tap / AUR
# pushes. Never cancel an in-flight release mid-publish — queue behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            platform: darwin/arm64
            suffix: darwin-arm64.tar.gz
          # Windows build disabled — no Windows asset is shipped yet, and the
          # runner adds ~5 minutes per release. Re-enable when the v1 path
          # picks up cross-platform distribution.
          # - os: windows-latest
          #   label: Windows (amd64)
          #   platform: windows/amd64
          #   suffix: windows-amd64.zip
          - os: ubuntu-24.04
            label: Linux (amd64)
            platform: linux/amd64
            suffix: linux-amd64.tar.gz
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The CLI generates the bindings the wails/v2 library consumes at runtime,
      # so it must track the module version rather than a hand-written pin.
      - name: Resolve Wails CLI version
        id: wails
        shell: bash
        run: |
          echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)" >> "$GITHUB_OUTPUT"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails
          key: wails-cli-${{ steps.wails.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        env:
          WAILS_VERSION: ${{ steps.wails.outputs.version }}
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Resolve version and artifact name
        id: meta
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v0.0.0-dev"
          fi
          # A tag matching v* is free-form text that ends up in artifact names
          # and in $GITHUB_OUTPUT. Reject anything that isn't a release version
          # before it gets that far.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to build unexpected version: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=klustr-${VERSION}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          DEB_VERSION="${VERSION#v}"
          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_name=klustr_${DEB_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          KLUSTR_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_TAGS: ${{ matrix.tags }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          TAGS_ARG=""
          if [ -n "$BUILD_TAGS" ]; then
            TAGS_ARG="-tags $BUILD_TAGS"
          fi
          wails build \
            $TAGS_ARG \
            -platform "$BUILD_PLATFORM" \
            -ldflags "-X klustr/app.Version=${KLUSTR_VERSION}" \
            -trimpath \
            -clean

      - name: Import code-signing certificate
        if: startsWith(matrix.os, 'macos')
        uses: Apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Sign macOS app
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in keychain" >&2
            exit 1
          fi
          codesign --force --timestamp --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$IDENTITY" build/bin/klustr.app
          codesign --verify --strict --verbose=2 build/bin/klustr.app

      - name: Notarize macOS app
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/bin/klustr.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple build/bin/klustr.app
          rm -f notarize.zip

      - name: Package macOS
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          ARTIFACT: ${{ steps.meta.outputs.name }}
          # bsdtar otherwise stores an AppleDouble ._ entry beside every file.
          COPYFILE_DISABLE: "1"
        run: |
          cd build/bin
          tar -czf "$ARTIFACT" klustr.app

      # - name: Package Windows
      #   if: matrix.os == 'windows-latest'
      #   shell: pwsh
      #   run: |
      #     cd build/bin
      #     Compress-Archive -Path klustr.exe -DestinationPath ${{ steps.meta.outputs.name }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          ARTIFACT: ${{ steps.meta.outputs.name }}
        run: |
          cd build/bin
          tar -czf "$ARTIFACT" klustr

      - name: Build Linux .deb
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          NFPM_VERSION: "2.46.3"
          VERSION: ${{ steps.meta.outputs.deb_version }}
          DEB_NAME: ${{ steps.meta.outputs.deb_name }}
        run: |
          set -euo pipefail
          # go install verifies against sum.golang.org, which a GitHub release
          # asset cannot offer: an asset can be replaced under its own tag.
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}"
          nfpm package \
            --config build/linux/nfpm.yaml \
            --packager deb \
            --target "build/bin/${DEB_NAME}"

      # A .tar.gz and a .deb are already compressed, and these only need to
      # outlive a re-run of the release job.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: build/bin/${{ steps.meta.outputs.name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.deb_name }}
          path: build/bin/${{ steps.meta.outputs.deb_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    timeout-minutes: 15
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum klustr-*.tar.gz klustr_*.deb > SHA256SUMS
          cat SHA256SUMS

      # Checksums catch a truncated download; provenance is what ties a binary
      # to the commit and workflow run that produced it.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/klustr-*.tar.gz
            artifacts/klustr_*.deb

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/klustr-*-darwin-arm64.tar.gz
            artifacts/klustr-*-linux-amd64.tar.gz
            artifacts/klustr_*_amd64.deb
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install (macOS Apple Silicon)

            The build is signed with a Developer ID Application certificate and notarized by Apple.

            ### Homebrew

            ```bash
            brew tap sametkum/klustr
            brew install klustr
            ```

            ### Manual

            ```bash
            curl -LO https://github.com/SametKUM/klustr/releases/download/${{ github.ref_name }}/klustr-${{ github.ref_name }}-darwin-arm64.tar.gz
            tar -xzf klustr-${{ github.ref_name }}-darwin-arm64.tar.gz
            mv klustr.app /Applications/
            open /Applications/klustr.app
            ```

            ## Install (Linux amd64)

            The Linux build links against `webkit2gtk-4.1` + `gtk-3`. Ubuntu
            24.04+, Fedora 39+, Arch and most modern distros ship those
            runtime libraries by default; on Ubuntu 22.04 install
            `libwebkit2gtk-4.1-0 libgtk-3-0` first.

            ### Debian / Ubuntu (.deb)

            The .deb pulls in the runtime dependencies automatically and
            registers a `klustr` desktop entry.

            ```bash
            VERSION="${{ github.ref_name }}"; DEB="klustr_${VERSION#v}_amd64.deb"
            curl -LO "https://github.com/SametKUM/klustr/releases/download/${VERSION}/${DEB}"
            sudo apt install "./${DEB}"
            ```

            ### Manual (tarball)

            ```bash
            curl -LO https://github.com/SametKUM/klustr/releases/download/${{ github.ref_name }}/klustr-${{ github.ref_name }}-linux-amd64.tar.gz
            tar -xzf klustr-${{ github.ref_name }}-linux-amd64.tar.gz
            install -Dm755 klustr ~/.local/bin/klustr
            klustr
            ```

            ## Verify a download

            Checksums for every asset:

            ```bash
            curl -LO https://github.com/SametKUM/klustr/releases/download/${{ github.ref_name }}/SHA256SUMS
            sha256sum -c --ignore-missing SHA256SUMS   # macOS: shasum -a 256 -c --ignore-missing SHA256SUMS
            ```

            Each asset also carries build provenance, which ties it to the
            commit and workflow run that produced it:

            ```bash
            gh attestation verify klustr-${{ github.ref_name }}-linux-amd64.tar.gz --repo SametKUM/klustr
            ```
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
