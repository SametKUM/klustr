name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # release.yml gates its build on this, so a tag runs the same checks main
  # does rather than trusting that it points at a commit CI already saw.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      # internal/kube is Wails-agnostic, but the root and app/ packages import
      # the Wails runtime, which needs GTK/WebKit to vet and build on Linux.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist via go:embed; static analysis (vet/test/
      # lint) doesn't need the real bundle, so stub a placeholder so the root
      # package compiles without a full frontend build.
      - name: Stub embedded frontend assets
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The concurrent code — informers, log streams, exec sessions, the
      # port-forward registry, the credential refresh timer — all lives under
      # internal, and -race costs 2-3x runtime.
      - name: go test -race
        run: go test -race ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    name: Vulnerabilities (Go)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Stub embedded frontend assets
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      # govulncheck reports a CVE only when the call graph actually reaches the
      # vulnerable symbol, so a finding is worth acting on. It reports rather
      # than blocks: an upstream CVE should not hold a release hostage.
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (TypeScript)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # tsc --noEmit says nothing about whether rollup can resolve and chunk
      # the bundle. Keep this after Lint, whose check:api runs before the
      # build regenerates the bindings.
      - name: Build
        run: npm run build

  site:
    name: Site (landing)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
