# Wails v3 project configuration. `wails3 dev` reads dev_mode; the build tasks
# render the macOS Info.plist and the Windows version resource and manifest
# from info (tools/buildassets).
version: '3'

info:
  companyName: "Samet Kum"
  productName: "Klustr"
  # The identifier Wails v2 gave the macOS bundle. macOS keeps the webview's
  # storage (the frontend's settings) per bundle identifier, so it must not
  # change.
  productIdentifier: "com.wails.klustr"
  copyright: "Copyright 2026 Samet Kum and the Klustr contributors"
  comments: "Kubernetes desktop client"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .codegraph
      - .claude
      - node_modules
      # Vite reloads the frontend on its own.
      - frontend
      # The dev binary is written to build/bin.
      - build
      - hack
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task dev:run
      type: primary
      exit_policy: shutdown
