<!doctype html>
<!--
  Source template for public/og.png (1200×630 social card).
  Regenerate after changing it, from the site/ directory:
    bunx playwright screenshot --viewport-size=1200,630 og-template.html public/og.png
  Keep the headline and the feature line in sync with the landing hero.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: oklch(0.968 0.007 85);
        --paper-2: oklch(0.986 0.005 85);
        --ink: oklch(0.21 0.025 264);
        --ink-2: oklch(0.42 0.02 264);
        --ink-3: oklch(0.57 0.015 264);
        --rule: oklch(0.21 0.025 264 / 0.3);
        --grid: oklch(0.6 0.09 240 / 0.16);
        --grid-major: oklch(0.6 0.09 240 / 0.3);
        --accent: oklch(0.47 0.17 256);
        --marker: oklch(0.8 0.12 256 / 0.55);
        --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 160px 160px, 160px 160px, 32px 32px, 32px 32px;
        background-position: -1px -1px;
      }
      .frame {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { width: 56px; height: 56px; border-radius: 12px; }
      .brand span { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
      .eyebrow { font-family: var(--mono); font-size: 22px; color: var(--ink-3); margin-bottom: 18px; }
      .eyebrow::before { content: "// "; color: var(--accent); }
      h1 {
        font-family: var(--mono);
        font-size: 64px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.045em;
      }
      h1 .marker {
        padding: 0 0.06em;
        background-image: linear-gradient(transparent 68%, var(--marker) 68%, var(--marker) 92%, transparent 92%);
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }
      .features {
        margin-top: 28px;
        font-size: 24px;
        line-height: 1.4;
        color: var(--ink-2);
        max-width: 980px;
      }
      .features b { color: var(--ink); font-weight: 600; }
      .footer { display: flex; align-items: center; justify-content: space-between; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--rule);
        background: var(--paper-2);
        border-radius: 6px;
        padding: 12px 20px;
        font-family: var(--mono);
        font-size: 20px;
      }
      .dot { width: 10px; height: 10px; border-radius: 9999px; background: oklch(0.52 0.14 160); }
      .meta { font-family: var(--mono); font-size: 20px; color: var(--ink-3); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="frame">
      <div class="brand">
        <img src="public/appicon.png" alt="" />
        <span>Klustr</span>
      </div>

      <div>
        <p class="eyebrow">kubernetes desktop client for macOS and Linux</p>
        <h1>Your clusters, live.<br /><span class="marker">Nothing installed in them.</span></h1>
        <p class="features">
          Live resources, <b>RBAC review</b>, <b>Helm</b>, <b>Argo CD</b>, <b>Flux</b>, <b>Gateway API</b> and
          <b>cert-manager</b> from the kubeconfig you already have.
        </p>
      </div>

      <div class="footer">
        <span class="pill"><span class="dot"></span>Open source, MIT</span>
        <span class="meta">klustr.dev</span>
      </div>
    </div>
  </body>
</html>
